# Netsoryn configuration example
#
# Config file locations (first match wins):
#   Linux:   ~/.config/netsoryn/config.yaml
#   macOS:   ~/Library/Application Support/netsoryn/config.yaml
#            or ~/.config/netsoryn/config.yaml
#   Windows: %APPDATA%\netsoryn\config.yaml
#   All:     /etc/netsoryn/config.yaml  (system-wide fallback)

# Refresh interval for live data (seconds)
refresh_interval: 2

# Default view on startup: dashboard, processes, network, ports, services, docker, dns, http
default_view: dashboard

# Log level: debug, info, warn, error, disabled
log_level: disabled

# Log file path (empty = stderr)
log_file: ""

# HTTP checks: list of URLs to monitor
http_checks:
  - url: "https://example.com"
    timeout: 10
  - url: "https://api.github.com"
    timeout: 10

# DNS checks: list of domains to resolve
dns_checks:
  - domain: "example.com"
    servers:
      - "8.8.8.8:53"
      - "1.1.1.1:53"

# Docker: socket path override (empty = Docker default / DOCKER_HOST env)
# Examples:
#   unix:///var/run/docker.sock        (Linux/macOS explicit)
#   npipe:////./pipe/docker_engine     (Windows named pipe)
#   tcp://localhost:2375               (remote TCP)
#   ssh://user@host                    (remote SSH)
docker_socket: ""

# Processes: max processes to display
process_limit: 50

# Ports: show only listening ports (true) or all connections (false)
ports_listen_only: true
