# Netsoryn configuration example
# Copy to ~/.config/netsoryn/config.yaml or /etc/netsoryn/config.yaml

# Refresh interval for live data (seconds)
refresh_interval: 2

# Default view on startup: dashboard, processes, network, ports, services, docker, dns, http
default_view: dashboard

# Log level: debug, info, warn, error, disabled
log_level: disabled

# Log file path (empty = stderr)
log_file: ""

# Read-only mode: prevents any write/restart operations
read_only: true

# Network rate limit for active checks (requests per second)
rate_limit: 10

# HTTP checks: list of URLs to monitor
http_checks:
  - url: "https://example.com"
    timeout: 10
  - url: "https://api.github.com"
    timeout: 10

# DNS checks: list of domains to resolve
dns_checks:
  - domain: "example.com"
    servers:
      - "8.8.8.8:53"
      - "1.1.1.1:53"

# SSH hosts: loaded from ~/.ssh/config by default
# Override with explicit list:
# ssh_hosts:
#   - name: "prod-web"
#     host: "192.168.1.10"
#     user: "deploy"
#     port: 22

# Docker: socket path (empty = default)
docker_socket: ""

# Processes: max processes to display
process_limit: 50

# Ports: show only listening ports (true) or all connections (false)
ports_listen_only: true

# Theme: default (auto-detects terminal colors)
theme: default
