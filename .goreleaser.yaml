version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: netsoryn
    main: ./cmd/netsoryn
    binary: netsoryn
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}

archives:
  - id: netsoryn
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - src: configs/netsoryn.example.yaml
        dst: config.example.yaml

nfpms:
  - id: netsoryn
    package_name: netsoryn
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: vitlixe
    homepage: https://github.com/vitlixe/netsoryn
    description: A terminal dashboard for system, network, and service diagnostics.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch
